name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WhatsApp runtime dependencies
        run: npm ci --prefix whatsapp-service --omit=optional

      - name: Run code preflight
        run: npm run preflight:code

      - name: Reject critical dependency findings
        run: npm audit --omit=dev --audit-level=critical
